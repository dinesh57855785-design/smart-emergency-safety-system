{% extends "base.html" %}
{% load static %}
{% block title %}Live Location{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0"><i class="bi bi-geo-alt"></i> Live Location Tracking</h3>
  <button id="shareBtn" class="btn btn-outline-primary btn-sm"><i class="bi bi-share"></i> Share Link</button>
</div>
<div class="se-card p-3">
  <div id="map" class="map-container" style="height:420px;background:#eef"></div>
  <p id="coordText" class="text-muted small mt-2 mb-0">Waiting for location...</p>
</div>
{% endblock %}
{% block extra_scripts %}
<script>const GOOGLE_MAPS_API_KEY = "{{ google_maps_api_key }}";</script>
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}"></script>
<script src="{% static 'js/location.js' %}"></script>
{% endblock %}
