{% extends 'base.html' %}
{% block title %}Notify Police{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2>Notify Nearest Police Station</h2>
    <p>Use this page to trigger a manual police notification (for testing).</p>
    <form id="notifyForm">
      <input type="hidden" name="sos_id" id="sos_id" value="">
      <div class="mb-3">
        <label for="sosIdInput" class="form-label">SOS Event ID (for testing)</label>
        <input class="form-control" id="sosIdInput" />
      </div>
      <button type="button" id="notifyBtn" class="btn btn-danger">Notify Police</button>
    </form>
    <div id="result" class="mt-3"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/police.js"></script>
<script>
document.getElementById('notifyBtn').addEventListener('click', ()=>{
  const sosId = document.getElementById('sosIdInput').value;
  if(!sosId) return alert('Please enter SOS id');
  fetch('{% url "police:notify" %}',{
    method:'POST',
    headers:{'X-CSRFToken': getCookie('csrftoken'),'Content-Type':'application/x-www-form-urlencoded'},
    body:`sos_id=${sosId}`
  }).then(r=>r.json()).then(j=>{ document.getElementById('result').textContent = JSON.stringify(j); });
});
function getCookie(name) { let cookieValue = null; if (document.cookie && document.cookie !== '') { const cookies = document.cookie.split(';'); for (let i = 0; i < cookies.length; i++) { const cookie = cookies[i].trim(); if (cookie.substring(0, name.length + 1) === (name + '=')) { cookieValue = decodeURIComponent(cookie.substring(name.length + 1)); break; } } } return cookieValue; }
</script>
{% endblock %}
