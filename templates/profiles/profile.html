{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-4">
    {% if profile.photo %}
    <img src="{{ profile.photo.url }}" class="img-fluid rounded" alt="Profile">
    {% else %}
    <div class="bg-secondary text-white p-5 text-center">No photo</div>
    {% endif %}
  </div>
  <div class="col-md-8">
    <h3>{{ profile.user.username }}</h3>
    <p><strong>Phone:</strong> {{ profile.phone }}</p>
    <p>{{ profile.bio }}</p>
    <a class="btn btn-outline-primary" href="{% url 'profiles:edit_profile' %}">Edit Profile</a>
  </div>
</div>
{% endblock %}
