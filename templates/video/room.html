{% extends 'base.html' %}
{% block title %}Video Room{% endblock %}
{% block content %}
<h2>Live Video Session</h2>
<p>Meeting: <strong>{{ session.room_name }}</strong></p>
<p><a class="btn btn-primary" href="{{ session.meeting_url }}" target="_blank">Open in new tab</a></p>
<div class="ratio ratio-16x9 mt-3">
  <iframe src="https://meet.jit.si/{{ session.room_name }}" allow="camera; microphone; fullscreen; display-capture" style="border:0;" allowfullscreen></iframe>
</div>
{% endblock %}
