{% extends 'base.html' %}
{% block title %}Emergency Contacts{% endblock %}
{% block content %}
<h2>Emergency Contacts</h2>
<a class="btn btn-primary mb-3" href="{% url 'contacts:contact_create' %}">Add Contact</a>
<table class="table table-striped">
  <thead><tr><th>Name</th><th>Phone</th><th>Relationship</th><th></th></tr></thead>
  <tbody>
    {% for c in contacts %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.phone }}</td>
      <td>{{ c.relationship }}</td>
      <td>
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'contacts:contact_edit' c.pk %}">Edit</a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'contacts:contact_delete' c.pk %}">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No contacts yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
