{% extends "base.html" %}
{% block title %}Delete Contact{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="se-card p-4 p-md-5 text-center">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:2.5rem"></i>
      <h4 class="mt-3">Remove {{ contact.name }}?</h4>
      <p class="text-muted">This trusted contact will no longer receive emergency alerts.</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Remove</button>
        <a href="{% url 'contacts:list' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
