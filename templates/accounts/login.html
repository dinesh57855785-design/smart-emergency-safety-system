{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="se-card p-4 p-md-5">
      <h3 class="text-center mb-1"><i class="bi bi-shield-fill-check text-primary"></i> Smart Emergency</h3>
      <p class="text-center text-muted mb-4">Sign in to your account</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Log In</button>
      </form>
      <div class="d-flex justify-content-between mt-3">
        <a href="{% url 'accounts:register' %}"><small>Create account</small></a>
        <a href="{% url 'accounts:password_reset' %}"><small>Forgot password?</small></a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
