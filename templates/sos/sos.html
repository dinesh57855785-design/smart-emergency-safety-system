{% extends 'base.html' %}
{% block title %}One-Tap SOS{% endblock %}
{% block content %}
<h2>One-Tap SOS</h2>
<p>Press the button below to send an SOS to your emergency contacts.</p>
<button id="sosBtn" class="btn btn-danger btn-lg">SEND SOS</button>
<button id="stopBtn" class="btn btn-secondary btn-lg" style="display:none;">STOP EMERGENCY</button>
<div id="status" class="mt-3"></div>
{% endblock %}
{% block scripts %}
<script>
const btn = document.getElementById('sosBtn');
const stopBtn = document.getElementById('stopBtn');
const status = document.getElementById('status');
let sosId = null;
let updateInterval = null;

btn.addEventListener('click', async ()=>{
  status.textContent = 'Sending...';
  let lat=null, lon=null;
  if (navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      lat = pos.coords.latitude; lon = pos.coords.longitude;
      sendSos(lat, lon);
    }, function(){
      sendSos();
    });
  } else { sendSos(); }
});

stopBtn.addEventListener('click', ()=>{
  if (updateInterval){
    clearInterval(updateInterval);
    updateInterval = null;
  }
  status.textContent = 'Emergency stopped.';
  stopBtn.style.display = 'none';
  sosId = null;
});

function sendSos(lat, lon){
  fetch('{% url "sos:trigger_sos" %}', {
    method: 'POST',
    headers: {'X-CSRFToken': getCookie('csrftoken'), 'Content-Type':'application/x-www-form-urlencoded'},
    body: `lat=${lat||''}&lon=${lon||''}`
  }).then(r=>r.json()).then(j=>{
    if(j.status==='ok'){
      status.textContent='SOS sent';
      sosId = j.id;
      // kick off initial notifications
      fetch('{% url "notifications:send_initial" %}',{
        method:'POST',
        headers:{'X-CSRFToken': getCookie('csrftoken'), 'Content-Type':'application/x-www-form-urlencoded'},
        body:`sos_id=${sosId}`
      });
      // start periodic location updates every 30 seconds
      updateInterval = setInterval(()=>{
        if (!sosId) return;
        if (navigator.geolocation){
          navigator.geolocation.getCurrentPosition(function(pos){
            const lat = pos.coords.latitude; const lon = pos.coords.longitude;
            fetch('{% url "notifications:update_location" %}',{
              method:'POST',
              headers:{'X-CSRFToken': getCookie('csrftoken'), 'Content-Type':'application/x-www-form-urlencoded'},
              body:`sos_id=${sosId}&lat=${lat}&lon=${lon}`
            });
          });
        }
      }, 30000);
      stopBtn.style.display = 'inline-block';
    } else status.textContent='Error';
  }).catch(()=> status.textContent='Error');
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
{% endblock %}
