{% extends 'base.html' %}
{% block title %}One-Tap SOS{% endblock %}
{% block content %}
<h2>One-Tap SOS</h2>
<p>Press the button below to send an SOS to your emergency contacts.</p>
<button id="sosBtn" class="btn btn-danger btn-lg">SEND SOS</button>
<div id="status" class="mt-3"></div>
{% endblock %}
{% block scripts %}
<script>
const btn = document.getElementById('sosBtn');
const status = document.getElementById('status');
btn.addEventListener('click', async ()=>{
  status.textContent = 'Sending...';
  let lat=null, lon=null;
  if (navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      lat = pos.coords.latitude; lon = pos.coords.longitude;
      sendSos(lat, lon);
    }, function(){
      sendSos();
    });
  } else { sendSos(); }
});

function sendSos(lat, lon){
  fetch('{% url "sos:trigger_sos" %}', {
    method: 'POST',
    headers: {'X-CSRFToken': getCookie('csrftoken'), 'Content-Type':'application/x-www-form-urlencoded'},
    body: `lat=${lat||''}&lon=${lon||''}`
  }).then(r=>r.json()).then(j=>{
    if(j.status==='ok') status.textContent='SOS sent'; else status.textContent='Error';
  }).catch(()=> status.textContent='Error');
}

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
</script>
{% endblock %}
